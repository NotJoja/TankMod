[config]
schemaVersion = "0.0.1"

[package]
namespace = "Joja"
name = "TankMod"
versionNumber = "1.0.0"
description = "Adds a drivable, cannon-firing T-34-85 tank to the R.E.P.O. shop."
websiteUrl = "https://github.com/NotJoja/TankMod"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2304"
Zehs-REPOLib = "4.5.1"

[build]
icon = "./thunderstore/icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/netstandard2.1/TankMod.dll"
target = "./"

[[build.copy]]
source = "./CREDITS.md"
target = "./"

[publish]
repository = "https://thunderstore.io"
communities = ["repo"]

[publish.categories]
repo = ["mods", "items"]
